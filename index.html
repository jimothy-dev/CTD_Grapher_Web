    <div id="root">
      <noscript>
        <h1>CTD Grapher</h1>
        <p>
          Depth profiles and transect sections from Sea-Bird <code>.cnv</code> and OpenCTD <code>.csv</code> CTD casts, drawn in the browser.
          Nothing to install; files never leave your computer. Single-station cast plots, multi-station depth profiles, and
          along-transect sections with the seafloor from your casts or from NOAA NCEI and EMODnet bathymetry.
          This app needs JavaScript to run.
        </p>
        <p>
          Source code: <a href="https://github.com/jimothy-dev/CTD_Grapher_Web">github.com/jimothy-dev/CTD_Grapher_Web</a>.
          Cite: <a href="https://doi.org/10.5281/zenodo.22371639">doi.org/10.5281/zenodo.22371639</a>.
          By James Simpson.
        </p>
